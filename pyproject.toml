[project]
name = "llm-openai-decisions"
version = "0.1"
description = "LLM plugin for the OpenAI Decisions API"
readme = "README.md"
authors = [{name = "Simon Willison"}]
license = "Apache-2.0"
classifiers = []
requires-python = ">=3.10"
dependencies = [
    "llm>=0.36",
    "httpx2>=2.13.0",
    "pydantic>=2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project.urls]
Homepage = "https://github.com/simonw/llm-openai-decisions"
Changelog = "https://github.com/simonw/llm-openai-decisions/releases"
Issues = "https://github.com/simonw/llm-openai-decisions/issues"
CI = "https://github.com/simonw/llm-openai-decisions/actions"

[project.entry-points.llm]
openai_decisions = "llm_openai_decisions"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx2-pytest>=2"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.sdist]
include = [
    "/llm_openai_decisions.py",
    "/tests/**/*.py",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
only-include = ["llm_openai_decisions.py"]
